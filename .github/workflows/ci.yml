# Typecheck, protocol tests and the production build on every push and pull
# request - the same `npm run build` Vercel runs, so a PR shows red before a
# deploy would have failed.
name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
